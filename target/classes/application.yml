spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sitienergia}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:54321}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

server:
  port: ${PORT:8080}
  address: 0.0.0.0

app:
  jwt-secret: "${JWT_SECRET:8a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6b7c8d9e0f1a2b}"
  jwt-expiration-ms: 86400000
  admin-password: "${ADMIN_PASSWORD:Admin123*#}"

logging:
  level:
    org.springframework.security: INFO